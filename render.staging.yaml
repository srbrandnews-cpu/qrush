services:
  # Pre-production copy of the platform. Uses its OWN database - never point
  # this service at the production DATABASE_URL.
  - type: web
    name: qrush-staging
    runtime: node
    plan: free
    branch: staging
    # Must match the staging Postgres region, otherwise Render's internal
    # DATABASE_URL hostname does not resolve.
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DB_CLIENT
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAILS
        sync: false
      - key: SUPPORT_WHATSAPP
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:support@qrush.in
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
