<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d9488" />
  <title>Live wait time — QRush</title>
  <script>
    try {
      var m = localStorage.getItem('tn_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = m;
      document.documentElement.style.colorScheme = m;
    } catch (e) {}
  </script>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    .live-page { min-height: 100vh; display: flex; flex-direction: column; }
    .live-top { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .live-main {
      flex: 1; display: flex; align-items: center; justify-content: center; padding: 26px 18px 40px;
    }
    .live-card {
      width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line);
      border-radius: 24px; padding: 28px 24px 22px; text-align: center; box-shadow: var(--shadow-md);
      position: relative; overflow: hidden;
    }
    .live-card::before {
      content: ''; position: absolute; inset: 0 0 auto 0; height: 120px; pointer-events: none;
      background: radial-gradient(240px 110px at 50% 0%, rgba(20, 184, 166, .18), transparent 70%);
    }
    .live-logo {
      width: 58px; height: 58px; border-radius: 17px; margin: 0 auto 14px; display: grid; place-items: center;
      background: var(--brand-grad); color: #fff; font-weight: 800; font-size: 26px;
      box-shadow: 0 14px 30px -16px rgba(13, 148, 166, .9); position: relative;
    }
    .live-card h1 { font-size: 23px; letter-spacing: -.03em; position: relative; }
    .live-sub { color: var(--muted); font-size: 13px; margin-top: 5px; position: relative; }
    .eta {
      margin: 22px auto 4px; width: 150px; height: 150px; border-radius: 50%;
      display: grid; place-items: center; position: relative;
      background: conic-gradient(var(--primary) calc(var(--p, 0) * 1%), var(--line) 0);
    }
    .eta::after { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: var(--card); }
    .eta-in { position: relative; z-index: 1; line-height: 1; }
    .eta-in b { display: block; font-size: 44px; font-weight: 800; letter-spacing: -.05em; }
    .eta-in span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; margin-top: 6px; }
    .eta-note { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .live-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    .live-stat { border: 1px solid var(--line); border-radius: 13px; padding: 12px; background: var(--primary-50); }
    .live-stat b { display: block; font-size: 21px; font-weight: 800; letter-spacing: -.03em; }
    .live-stat span { font-size: 11px; color: var(--muted); font-weight: 600; }
    .live-cta { margin-top: 18px; }
    .live-foot {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      font-size: 11.5px; color: var(--muted-2); margin-top: 16px;
    }
    .live-foot .dot { background: #22c55e; animation: pulse 1.7s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .live-note { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.55; }
    .live-err { color: var(--red); font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="live-page">
    <header class="live-top">
      <a class="brand" href="/"><img class="brand-mark" src="/img/logo.svg" alt="" /> QRush</a>
      <button class="theme-toggle" data-theme-toggle title="Dark mode"><span data-theme-icon>☾</span></button>
    </header>

    <main class="live-main">
      <div class="live-card">
        <div class="live-logo" id="logo">Q</div>
        <h1 id="venue">Loading…</h1>
        <div class="live-sub">Live kitchen queue · updates every 30 seconds</div>

        <div class="eta" id="eta-ring" style="--p:0">
          <div class="eta-in">
            <b id="eta">—</b>
            <span>minutes wait</span>
          </div>
        </div>
        <div class="eta-note" id="eta-note">Checking the kitchen…</div>

        <div class="live-grid">
          <div class="live-stat"><b id="queue">—</b><span>orders in queue</span></div>
          <div class="live-stat"><b id="tables">—</b><span>tables live</span></div>
        </div>

        <a class="btn btn-primary btn-block live-cta" href="/" id="home-link">Table par QR scan karke order karein</a>
        <div class="live-note">Yeh page sirf wait time dikhata hai. Order karne ke liye table par rakha QR code scan karein.</div>
        <div class="live-foot"><span class="dot"></span> <span id="updated">Connecting…</span></div>
        <div class="live-err hidden" id="err"></div>
      </div>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script>
    (() => {
      const slug = location.pathname.split('/').filter(Boolean).pop() || '';
      const $ = (id) => document.getElementById(id);

      async function load() {
        try {
          const data = await TN.api('/api/public/venue/' + encodeURIComponent(slug), { noRedirect: true });
          const r = data.restaurant;
          $('venue').textContent = r.name;
          $('logo').textContent = (r.name || 'Q').trim().charAt(0).toUpperCase();
          document.title = 'Live wait — ' + r.name;
          $('queue').textContent = data.queue;
          $('tables').textContent = data.tables;

          const eta = Number(data.eta_minutes) || 0;
          $('eta').textContent = eta === 0 ? '0' : eta;
          $('eta-note').textContent = eta === 0
            ? 'Kitchen free hai — abhi order karein 🎉'
            : (eta <= 10 ? 'Bilkul paas hai — thoda wait.' : 'Thoda rush hai — ghar se nikalne se pehle ek baar dekh lein.');
          $('eta-ring').style.setProperty('--p', Math.max(4, Math.min(100, eta * 4)));

          const t = new Date(data.updated_at);
          $('updated').textContent = 'Live · updated ' + t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
          $('err').classList.add('hidden');
        } catch (err) {
          $('err').textContent = err.message || 'Wait time load nahi hua.';
          $('err').classList.remove('hidden');
          $('eta-note').textContent = 'Restaurant abhi offline lag raha hai.';
        }
      }

      if (!slug) {
        $('venue').textContent = 'Restaurant not found';
        $('eta-note').textContent = 'Is link mein restaurant ka naam missing hai.';
        return;
      }
      load();
      setInterval(load, 30000);
    })();
  </script>
</body>
</html>
