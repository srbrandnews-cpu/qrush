<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ea580c" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Website inactive — QRush</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #0f172a;
      background:
        radial-gradient(1200px 600px at 15% -10%, #fed7aa 0%, transparent 60%),
        radial-gradient(900px 500px at 100% 110%, #ffedd5 0%, transparent 55%),
        #fff7ed;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border: 1px solid #fed7aa;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 24px 60px -30px rgba(234, 88, 12, 0.45);
    }
    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: -0.5px;
    }
    p {
      margin: 0 0 12px;
      font-size: 15px;
      line-height: 1.6;
      color: #475569;
    }
    b { color: #0f172a; }
    .btn {
      display: inline-block;
      margin: 10px 0 14px;
      padding: 12px 22px;
      border-radius: 12px;
      background: #ea580c;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }
    .btn:hover { background: #c2410c; }
    .tiny {
      margin: 0;
      font-size: 12.5px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">Q</div>
    <h1>Website temporarily inactive</h1>
    <p>Yeh website abhi <b>inactive</b> hai. Iska data safe hai aur baad mein dobara chalu kiya jayega.</p>
    <p>Free Digital QR Menu Generator yahan available hai:</p>
    <a class="btn" href="https://www.qrush.in/">Go to qrush.in →</a>
    <p class="tiny">Restaurant owner? Apna free QR menu banane ke liye qrush.in kholein.</p>
  </main>
</body>
</html>
