name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  verify:
    name: Syntax, smoke test, dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax gate
        run: npm run check:syntax

      - name: End-to-end smoke test (throwaway DB)
        run: npm test

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: Build placeholder (kept for Render parity)
        run: npm run build
